# Memories: free-form text stored as searchable embeddings for contextual recall,
# complementing the structured data in the database. User-scoped with an optional
# organization. A memory may reference encrypted media but never inlines bytes.
#
# `searchable` is the single privacy switch: when true the server holds plaintext
# `source_text` + chunk embeddings and indexes them; when false the content lives
# only in the encrypted media reference (client-side encryption) and the memory is
# not contextually searchable. On self-hosted deployments the flag is forced true.

type Memory {
  id: ID!
  """Owning organization id, when the memory is shared in an org (null = personal)."""
  organization_id: ID
  """text | image | audio | video | document."""
  kind: String!
  title: String
  """Plaintext source — present only when searchable; null otherwise."""
  source_text: String
  """Media handler id for encrypted bytes (null = none)."""
  media: ID
  searchable: Boolean!
  deleted: Boolean!
  created_at: String!
  updated_at: String!
}

"""A memory matched by searchMemories, with its fused relevance score and the
best-matching chunk text as a snippet."""
type MemorySearchHit {
  memory: Memory!
  score: Float!
  snippet: String
}

# ── Inputs ────────────────────────────────────────────────────────────────────

"""Create a memory. `sourceText` is required for searchable text memories; binary
kinds reference encrypted bytes via `media`. `searchable` defaults to false on
multi-tenant deployments (forced true on self-host)."""
input CreateMemoryInput {
  kind: String
  title: String
  sourceText: String
  media: ID
  searchable: Boolean
  organizationId: ID
}

"""Partial update — omitted fields are left unchanged."""
input UpdateMemoryInput {
  title: String
  sourceText: String
}

# ── Filtering ─────────────────────────────────────────────────────────────────
# Reuses the shared per-field operator inputs from _shared.graphql.

input MemoryFilter {
  kind: StringFilter
  title: StringFilter
  searchable: BoolFilter
  deleted: BoolFilter
  created_at: DateFilter
  updated_at: DateFilter

  and: [MemoryFilter!]
  or: [MemoryFilter!]
  not: MemoryFilter
}

# ── Sorting ───────────────────────────────────────────────────────────────────

enum MemorySortField {
  CREATED_AT
  UPDATED_AT
  TITLE
}

input MemorySort {
  field: MemorySortField!
  direction: SortDirection = DESC
}

# ── Operations ────────────────────────────────────────────────────────────────

extend type Query {
  """List memories (excludes soft-deleted unless filtered otherwise)."""
  memories(filter: MemoryFilter, sort: [MemorySort!], limit: Int, offset: Int): [Memory!]!
  memoryCount(filter: MemoryFilter): Int!
  memory(id: ID!): Memory
  """Hybrid semantic + lexical search over the caller's searchable memories.
  When the user's `search_embedding_mode` setting is `client`, pass `queryVector`
  (a normalized query embedding computed in the browser); otherwise the server
  embeds the query text. Either way the lexical (BM25) arm always runs."""
  searchMemories(query: String!, limit: Int, queryVector: [Float!]): [MemorySearchHit!]!
}

extend type Mutation {
  createMemory(input: CreateMemoryInput!): Memory!
  updateMemory(id: ID!, input: UpdateMemoryInput!): Memory!
  deleteMemory(id: ID!): Boolean!
  """Toggle indexing. false→true chunks + embeds the source; true→false drops all
  chunks/vectors and clears plaintext immediately (privacy guarantee)."""
  setMemorySearchable(id: ID!, searchable: Boolean!): Memory!
}
