# Shared, entity-agnostic primitives for the canonical entity surface. Per-field
# operator inputs compile to a server-side WHERE clause (each operator present on
# a filter is ANDed; entities combine fields with their own and/or/not). Any
# entity's Filter input reuses these — see ContactFilter, EventFilter.

input StringFilter {
  eq: String
  ne: String
  contains: String
  startsWith: String
  endsWith: String
  in: [String!]
  """Case-sensitive regular expression (string::matches)."""
  matches: String
  """Full-text search (the @@ match operator). Requires a FULLTEXT index on the
  field — currently only contact.formatted_name; using it elsewhere errors."""
  search: String
  """Approximate match via string::similarity::fuzzy; tolerates typos. No index needed."""
  fuzzy: String
  isNull: Boolean
}

input BoolFilter {
  eq: Boolean
}

input IntFilter {
  eq: Int
  gt: Int
  lt: Int
}

"""Operators for a real datetime field (created_at / updated_at / start). String
values are ISO-8601 instants; `withinLast` is a SurrealDB duration like `30d`."""
input DateFilter {
  eq: String
  before: String
  after: String
  withinLast: String
}

"""Filter a list of plain strings (categories / nicknames / keywords)."""
input StringListFilter {
  """Every given value must be present."""
  hasAll: [String!]
  """At least one given value must be present."""
  hasAny: [String!]
  """Case-insensitive substring match against any element."""
  contains: String
  isEmpty: Boolean
  size: IntFilter
}

"""A centre point plus radius for proximity search."""
input NearInput {
  lat: Float!
  lng: Float!
  radiusMeters: Float!
}

"""Geo predicates against a GEO point (lat/lng)."""
input GeoFilter {
  """Within radiusMeters of the given point (haversine, metres)."""
  near: NearInput
  """GeoJSON geometry (e.g. a Polygon). The point must fall inside it."""
  within: Map
  isNull: Boolean
}

enum SortDirection {
  ASC
  DESC
}
