input SendEmailInput {
  to: [String!]!
  subject: String!
  text: String!
  html: String
}

type SendEmailResult {
  delivered: Boolean!
}

extend type Mutation {
  """
  Sends a transactional email through Neoworks. Requires the `email:write` scope.
  """
  sendEmail(input: SendEmailInput!): SendEmailResult!
}
