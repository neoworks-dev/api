type OAuthClient {
  id: ID!
  """Human-readable display name, shown in first-party UI (e.g. the Vault)."""
  name: String
  """Scopes this client is allowed to request."""
  scopes: [String!]!
  redirect_uris: [String!]!
  """True = PKCE-only; client has no secret."""
  public: Boolean!
  """True = consent screen is skipped; scopes granted automatically."""
  auto_grant_scopes: Boolean!
}

type RefreshToken {
  id: ID!
  client: OAuthClient!
  scopes: [String!]!
  expires_at: String!
  created_at: String!
  revoked: Boolean!
  used: Boolean!
}

extend type Query {
  refreshTokens(limit: Int, offset: Int): [RefreshToken!]!
}

extend type Mutation {
  revokeRefreshToken(id: ID!): Boolean!
}
