"""Storage usage for the authenticated user, broken down by file category and billing tier."""
type StorageUsage {
  """Authoritative total bytes stored, deduplicated at the chunk level."""
  totalBytes: Int!
  """Logical size per file category (photos, videos, documents, other)."""
  categories: [StorageCategory!]!
  """Currently-stored bytes per billing tier, with the locked-in price."""
  tiers: [StorageTier!]!
  """Daily cumulative stored bytes over the last year, reconstructed from billing intervals."""
  history: [StoragePoint!]!
}

type StorageCategory {
  """One of: photos, videos, documents, other."""
  category: String!
  bytes: Int!
}

type StorageTier {
  """One of: hot, cold, archive."""
  tier: String!
  bytes: Int!
  unitPricePerGbMonth: Float!
  currency: String!
}

type StoragePoint {
  """ISO-8601 date (YYYY-MM-DD)."""
  date: String!
  bytes: Int!
}

extend type Query {
  """Storage usage breakdown for the authenticated user. Requires the storage:read scope."""
  storageUsage: StorageUsage!
}
