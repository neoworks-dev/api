# Control-plane SurrealDB (the system database the API/harness connects to). One
# replica backed by a PVC, reachable in-cluster at control-surreal:8000.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: control-surreal-data
  namespace: neoworks-control
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-surreal
  namespace: neoworks-control
  labels:
    app: control-surreal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-surreal
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: control-surreal
    spec:
      containers:
        - name: surrealdb
          image: surrealdb/surrealdb:latest-dev
          imagePullPolicy: IfNotPresent
          args: ["start", "--user", "root", "--pass", "root", "--bind", "0.0.0.0:8000", "rocksdb:/data/control.db"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 2
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: control-surreal-data
---
apiVersion: v1
kind: Service
metadata:
  name: control-surreal
  namespace: neoworks-control
spec:
  selector:
    app: control-surreal
  ports:
    - port: 8000
      targetPort: 8000
