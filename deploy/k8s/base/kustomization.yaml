apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base = local/kind target. Assumes the tidb-operator and spotahome redis-operator
# (and their CRDs) are already installed, and that the Secrets neoworks-signing-key
# and neoworks-api-secrets have been created (see README.md). 90-demo-job.yaml is a
# standalone proof-of-concept and is intentionally NOT included here.
resources:
  - 00-namespaces.yaml
  - 20-rbac.yaml
  - 16-minio.yaml
  - 25-redis-failover.yaml
  - 30-surreal-tikv.yaml
  - 31-surreal-compute.yaml
  - 32-migrate-job.yaml
  - 40-api.yaml
  - 41-api-hpa.yaml
