# MinIO object storage for local/kind. The API stores encrypted media chunks here
# and creates its bucket on boot (objectstore.EnsureBucket). In production this is
# replaced by an external managed S3 endpoint (see overlays/prod) — the API only
# needs the S3_* env vars, so no code changes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: neoworks-control
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: neoworks-control
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-10-02T17-50-41Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: neoworks-control
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
