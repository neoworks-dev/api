# Distributed storage layer for the control-plane SurrealDB, via the pingcap
# tidb-operator (must be installed first — see README). We run PD + TiKV only
# (no TiDB SQL layer): SurrealDB speaks the TiKV protocol directly through PD.
# TiKV replicates data across its nodes with Raft, so losing a TiKV pod does not
# lose data or writes — this is what makes the control plane highly available.
#
# 3 PD + 3 TiKV is the minimum that tolerates a single-node failure (quorum). The
# resource requests here are laptop/kind-sized; the prod overlay bumps them and
# adds cross-node anti-affinity.
#
# VERSION PINNING (verification gate — see README and surrealdb/surrealdb#4697):
# the SurrealDB compute image (31-surreal-compute.yaml) and this TiKV version must
# be a pair known to interoperate. Do NOT float either to a "latest" tag — a
# SurrealDB/TiKV data-format skew corrupts or locks the store.
apiVersion: pingcap.com/v1alpha1
kind: TidbCluster
metadata:
  name: neoworks-control-tikv
  namespace: neoworks-control
spec:
  version: v7.5.1
  timezone: UTC
  pvReclaimPolicy: Retain
  configUpdateStrategy: RollingUpdate
  pd:
    baseImage: pingcap/pd
    replicas: 3
    requests:
      storage: "1Gi"
      cpu: "100m"
      memory: "256Mi"
    config: {}
  tikv:
    baseImage: pingcap/tikv
    replicas: 3
    requests:
      storage: "2Gi"
      cpu: "200m"
      memory: "512Mi"
    config:
      storage:
        reserve-space: "0MB"
