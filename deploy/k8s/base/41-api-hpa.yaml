# Autoscales the API on CPU. Requires the container CPU request in 40-api.yaml and
# a running metrics-server. When average CPU across pods exceeds 70% of the request,
# the HPA adds pods (up to maxReplicas); when it drops, it scales back down.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: neoworks-api
  namespace: neoworks-control
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: neoworks-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
