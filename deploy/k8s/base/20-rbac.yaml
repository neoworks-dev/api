# Identity the API/harness runs as, plus the permissions the kubernetes
# provisioner needs: manage StatefulSets/Services/PVCs/Pods in the tenants
# namespace, exec into pods (du for storage), and read pod metrics (kubectl top).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neoworks-provisioner
  namespace: neoworks-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: neoworks-provisioner
rules:
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "persistentvolumeclaims", "pods"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: neoworks-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: neoworks-provisioner
subjects:
  - kind: ServiceAccount
    name: neoworks-provisioner
    namespace: neoworks-control
