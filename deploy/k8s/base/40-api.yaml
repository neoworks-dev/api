# The real neoworks API server (cmd/api). Stateless — all state lives in SurrealDB,
# Redis and S3 — so it scales horizontally: the ClusterIP Service below load-balances
# across every ready pod, and the HPA (41-api-hpa.yaml) adds/removes pods on CPU.
# This one binary serves both the GraphQL API and in-process OAuth token issuance.
#
# Runs as the neoworks-provisioner ServiceAccount (20-rbac.yaml) so its in-cluster
# kubectl client is authorized to provision per-org tenant StatefulSets.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neoworks-api
  namespace: neoworks-control
  labels:
    app: neoworks-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: neoworks-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: neoworks-api
    spec:
      serviceAccountName: neoworks-provisioner
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: neoworks-api:demo
          imagePullPolicy: Never
          command: ["/usr/local/bin/api"]
          workingDir: /app
          ports:
            - containerPort: 8081
          # Bridges the gap between the pod being removed from Service endpoints and
          # the process getting SIGTERM, so no request is routed to a dying pod.
          # Pairs with the in-process graceful shutdown in cmd/api/main.go.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
          env:
            - name: PORT
              value: "8081"
            # ── Control-plane SurrealDB (HA compute Service) ──
            - name: SURREAL_URL
              value: "ws://control-surreal:8000/rpc"
            - name: SURREAL_USER
              value: "root"
            - name: SURREAL_PASS
              value: "root"
            - name: SURREAL_NS
              value: "neoworks"
            - name: SURREAL_DB
              value: "auth"
            # ── Redis (Sentinel HA — follows the master across failovers) ──
            - name: REDIS_SENTINEL_ADDRS
              value: "rfs-neoworks-redis:26379"
            - name: REDIS_MASTER_NAME
              value: "mymaster"
            # ── Object storage (MinIO in kind; external S3 in prod overlay) ──
            - name: S3_ENDPOINT
              value: "minio:9000"
            - name: S3_ACCESS_KEY_ID
              value: "minioadmin"
            - name: S3_SECRET_ACCESS_KEY
              value: "minioadmin"
            - name: S3_BUCKET_PRIVATE
              value: "neoworks-private"
            # ── OAuth signing key: SHARED across all pods (critical). Without a
            #    shared key each pod signs JWTs a sibling pod cannot verify. ──
            - name: AUTH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: neoworks-signing-key
                  key: auth.pem
            # ── Per-org instance root-password encryption key (base64 of 32 bytes) ──
            - name: INSTANCE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: neoworks-api-secrets
                  key: instance-key
            # ── Issuer / link identity (pinned so all pods issue identical tokens) ──
            - name: ISSUER_URL
              value: "https://oauth.neoworks.localhost"
            - name: BASE_DOMAIN
              value: "neoworks.localhost"
            - name: BASE_SCHEME
              value: "https"
            # ── Tenant provisioning target ──
            - name: TENANT_K8S_NAMESPACE
              value: "neoworks-tenants"
            - name: TENANT_SURREAL_IMAGE
              value: "surrealdb/surrealdb:latest-dev"
            - name: TENANT_K8S_STORAGE_SIZE
              value: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: neoworks-api
  namespace: neoworks-control
  labels:
    app: neoworks-api
spec:
  selector:
    app: neoworks-api
  ports:
    - port: 8081
      targetPort: 8081
