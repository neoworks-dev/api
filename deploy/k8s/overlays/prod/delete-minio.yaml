# Production uses external managed S3, so the in-cluster MinIO from the base is
# removed. The API reaches S3 via the neoworks-s3 Secret (see patch-api.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: neoworks-control
$patch: delete
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: neoworks-control
$patch: delete
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: neoworks-control
$patch: delete
