# Prod API tuning: spread pods across nodes, larger resources, pull from a registry,
# and read S3 config from a Secret pointing at external managed object storage.
# (env entries merge by name, overriding the base MinIO values.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neoworks-api
  namespace: neoworks-control
spec:
  replicas: 3
  template:
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: neoworks-api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: registry.example.com/neoworks/api:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          env:
            - name: S3_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: neoworks-s3
                  key: endpoint
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: neoworks-s3
                  key: access-key-id
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: neoworks-s3
                  key: secret-access-key
            - name: ISSUER_URL
              value: "https://oauth.neoworks.dev"
            - name: BASE_DOMAIN
              value: "neoworks.dev"
            - name: BASE_SCHEME
              value: "https"
