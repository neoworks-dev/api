apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Production overlay. Promotes the kind base to a real cluster:
#  - external managed S3 (MinIO removed; S3_* sourced from the neoworks-s3 Secret)
#  - bigger requests/limits, higher autoscale ceiling, cross-node anti-affinity
#  - Ingress + TLS in front of the API Service
#
# Still expected out-of-band (see README): a real storageClassName for the TiKV/
# Redis PVCs, an image registry reachable by the cluster, and Secrets sourced from
# a real manager (sealed-secrets / external-secrets) rather than `kubectl create`.
resources:
  - ../../base
  - ingress.yaml

patches:
  - path: patch-api.yaml
    target:
      kind: Deployment
      name: neoworks-api
  - path: patch-hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: neoworks-api

# Multi-document strategic-merge deletes (removing base MinIO) belong here rather
# than under `patches`, which expects one patch per file.
patchesStrategicMerge:
  - delete-minio.yaml
