apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Fast dev target (Tier 2): the real API in kind, but single-node dependencies, no
# operators, no secrets. Boots in ~30s. Use for exercising the app in-cluster
# (probes, rollout, tenant provisioning via kubectl). For HA/failover testing use
# base/; for production use overlays/prod.
#
# Builds on the base directory (so `kubectl apply -k` works without relaxed load
# restrictions), then strips the HA layer (TiKV, Redis Sentinel, HPA), patches the
# SurrealDB compute down to single-node rocksdb, adds a plain Redis, and drops the
# API's Sentinel/secret env.
resources:
  - ../../base
  - redis.yaml

patchesStrategicMerge:
  - delete-ha.yaml
  - patch-surreal.yaml
  - patch-api.yaml
