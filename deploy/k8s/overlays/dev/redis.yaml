# Dev-only single-node Redis, ephemeral. No Sentinel/operator — the API connects
# with a plain REDIS_URL (see api.yaml), which is the fallback path in
# cache.ConfigFromEnv when REDIS_SENTINEL_ADDRS is unset.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: neoworks-control
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: neoworks-control
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
