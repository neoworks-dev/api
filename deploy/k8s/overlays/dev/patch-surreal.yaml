# Turn the base HA SurrealDB compute into a single-node rocksdb instance for dev:
# local embedded storage on an ephemeral volume, one replica. The args list is
# replaced wholesale (no tikv:// endpoint), and an emptyDir volume is added.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-surreal
  namespace: neoworks-control
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  template:
    spec:
      containers:
        - name: surrealdb
          # latest-dev matches the process-compose instance and the tenant image
          # (TENANT_SURREAL_IMAGE). The base pins v2.1.4 only for TiKV pairing,
          # which doesn't apply to single-node rocksdb — and the migrations use
          # functions (e.g. string::is_email) that v2.1.4 rejects.
          image: surrealdb/surrealdb:latest-dev
          args: ["start", "--user", "root", "--pass", "root", "--bind", "0.0.0.0:8000", "rocksdb:/data/dev.db"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
